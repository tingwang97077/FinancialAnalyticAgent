services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ffa_app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ffa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
