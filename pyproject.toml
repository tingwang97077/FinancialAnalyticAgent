[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "financial-fundamentals-agent"
version = "0.1.0"
description = "A grounded financial fundamentals agent for SEC EDGAR filings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langfuse>=3,<4",
    "lxml>=6,<7",
    "openai>=1.97,<2",
    "pendulum>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "ragas>=0.3,<1",
    "sentence-transformers>=5,<6",
    "sqlalchemy>=2,<2.1",
    "sqlglot>=27,<28",
    "streamlit>=1.47,<2",
    "structlog>=25,<26",
    "tenacity>=9,<10",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
airflow = [
    "apache-airflow==3.3.0",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ffa"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

